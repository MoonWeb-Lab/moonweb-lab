<!DOCTYPE html>
<html lang="ru" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>MoonWeb Lab: сайты, онлайн-меню и системы онлайн-заказов для бизнеса</title>
    <meta name="description" content="Разработка быстрых сайтов, онлайн-меню, систем онлайн-записи и интеграций с Telegram для локального бизнеса, общепита, бьюти-студий и клиник." />
    <meta name="theme-color" content="#0B0B0F" />
    <link rel="canonical" href="https://moonweb-lab.github.io/moonweb-lab/" />

    <!-- Preload avatar for fast LCP -->
    <link rel="preload" as="image" href="./avatar.jpg" type="image/jpeg" fetchpriority="high" />

    <!-- Google Fonts: Manrope & Inter (Cyrillic support) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="./avatar.jpg" />
    <link rel="apple-touch-icon" href="./avatar.jpg" />

    <!-- Open Graph (Telegram, Instagram, WhatsApp) -->
    <meta property="og:site_name" content="MoonWeb Lab" />
    <meta property="og:title" content="MoonWeb Lab: сайты и системы онлайн-заказов для бизнеса" />
    <meta property="og:description" content="Разработка быстрых сайтов, онлайн-меню, систем онлайн-записи и интеграций с Telegram для бизнеса." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://moonweb-lab.github.io/moonweb-lab/" />
    <meta property="og:image" content="https://moonweb-lab.github.io/moonweb-lab/avatar.jpg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MoonWeb Lab: сайты и системы онлайн-заказов для бизнеса" />
    <meta name="twitter:description" content="Разработка быстрых сайтов, онлайн-меню, систем онлайн-записи и интеграций с Telegram для бизнеса." />
    <meta name="twitter:image" content="https://moonweb-lab.github.io/moonweb-lab/avatar.jpg" />

    <!-- Structured Data (JSON-LD) for MoonWeb Lab -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "MoonWeb Lab",
      "image": "https://moonweb-lab.github.io/moonweb-lab/avatar.jpg",
      "url": "https://moonweb-lab.github.io/moonweb-lab/",
      "priceRange": "$$",
      "description": "Разработка быстрых сайтов, онлайн-меню, систем онлайн-записи и интеграций с Telegram для локального бизнеса, общепита, бьюти-студий и клиник.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "BY"
      },
      "sameAs": [
        "https://t.me/moonweb_lab",
        "https://www.instagram.com/moonweb_labs"
      ]
    }
    </script>

    <!-- Google Fonts: Preconnect & Load with font-display swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0B0B0F] text-[#F4F4F6] antialiased selection:bg-purple-500/30 selection:text-white min-h-screen overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
